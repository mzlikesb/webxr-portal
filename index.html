<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>MR Wall Portal</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      /* three.js가 추가하는 canvas를 화면 전체로. AR 세션 중엔 헤드셋이
         canvas를 직접 합성하므로 이 CSS는 세션 밖 2D 화면에만 영향을 준다. */
      /* 이 CSS는 세션 '밖' 2D 화면에만 영향을 준다.

         XR 세션에 들어가면 three.js가 이 canvas의 WebGL 컨텍스트를
         gl.makeXRCompatible()로 승격시키고, 그 컨텍스트로 XRWebGLLayer를
         만들어 session의 baseLayer로 꽂는다. 그 뒤로는 레이어의 프레임버퍼가
         헤드셋 컴포지터로 가고 페이지 자체는 그려지지 않는다.
         즉 canvas의 '컨텍스트'는 세션의 핵심이지만 canvas의 '레이아웃'은
         아무도 보지 않는다. 해상도도 CSS나 renderer.setSize()가 아니라
         XRWebGLLayer.framebufferWidth/Height가 정한다
         (조절 노브: renderer.xr.setFramebufferScaleFactor).

         z-index가 필요한 이유는 따로다. three.js가 canvas를 body 끝에
         append하므로 DOM 순서상 #ui보다 뒤에 오고, 둘 다 position:fixed인
         순간 canvas가 UI를 덮는다. canvas는 투명해서 버튼이 보이긴 하는데
         클릭은 canvas가 먹는다. 그래서 순서를 명시한다. */
      canvas { position: fixed; inset: 0; display: block; z-index: 0; }

      #ui {
        position: fixed;
        z-index: 1;
        inset: 0 0 auto 0;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
        pointer-events: none; /* 패널 자체는 클릭을 먹지 않게 */
      }
      #enter {
        pointer-events: auto;
        padding: 14px 28px;
        font: inherit;
        font-size: 18px;
        border: 1px solid #555;
        border-radius: 8px;
        background: #222;
        color: #eee;
        cursor: pointer;
      }
      #enter:disabled { opacity: 0.4; cursor: default; }
      #status { margin: 0; white-space: pre-wrap; max-width: 90vw; }
    </style>
  </head>
  <body>
    <div id="ui">
      <button id="enter" disabled>확인 중…</button>
      <pre id="status"></pre>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
